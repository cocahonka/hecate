services:
  postgres:
    image: postgres:17
    container_name: hecate_postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --requirepass password
    container_name: hecate_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
