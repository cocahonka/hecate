services:
  postgres:
    image: postgres:17
    container_name: hecate_postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - hecate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --requirepass password
    container_name: hecate_redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - hecate-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hecate_user_service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=user_service
      - CACHE_HOST=redis
      - CACHE_PORT=6379
      - CACHE_PASSWORD=password
      - JWT_SECRET=your-secret-key-here
      - ENV=production
      - CHALLENGE_TTL=2m
      - SERVER_PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hecate-network

networks:
  hecate-network:
    driver: bridge
